{% extends "base.html" %}{% block content %}<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p>Use a unique password of at least 10 characters.</p></div></div><section class="panel" style="max-width:560px"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token_value }}"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="10" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Update password →</button></form></section>{% endblock %}
